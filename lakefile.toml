name = "PTSBetaEta"
version = "1.0.0"
defaultTargets = ["PTSBetaEta", "Challenge", "Solution", "CheckAxioms"]

[leanOptions]
autoImplicit = false

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.35.0"

[[lean_lib]]
name = "PTSBetaEta"

[[lean_lib]]
name = "Challenge"
roots = ["Challenge"]

[[lean_lib]]
name = "Solution"
roots = ["Solution"]

[[lean_lib]]
name = "CheckAxioms"
roots = ["CheckAxioms"]
